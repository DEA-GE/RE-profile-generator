#--define study region----------------------------------------------------------------------
study_region_name: Denmark #[mandatory][string] 
country_code: DNK #[mandatory][string: 3-letter ISO code] 

study_area:
    source: adm #[mandatory][adm/custom/bbox] select one method
    # adm 
    GADM_source: wb #[situational][gadm/wb/gb], gadm: https://gadm.org/maps.html, wb (worldbank) or gb (geoboundaries): https://www.arcgis.com/apps/mapviewer/index.html?layers=d1b630859ed84e92a3782fed6a612b63 (downloaded via space2stats client, which can access worldbank and geoboundaries data) 
    GADM_region_name: Denmark #[situational][string] exact name as in GADM file (NAME_{ADM_level}) or on WorldBank https://www.arcgis.com/apps/mapviewer/index.html?layers=d1b630859ed84e92a3782fed6a612b63 (NAM_{ADM_level}) 
    GADM_level: 0 #[situational][integer]
    # custom
    custom_study_area_filename: Kilifi.geojson #[situational][string] use filepath to the file 
    # bbox
    bbox: [9.8828, 54.9881, 10.876700000000001, 55.780899999999995] # [situational][xmin, ymin, xmax, ymax]; Odense: [9.8828, 54.9881, 10.876700000000001, 55.780899999999995]


#-- Weather data download settings -------------------------------------------------------------
cutout_timeframe: 
    start: 2024-01-01 #[mandatory][YYYY-MM-DD] start date for weather data download 
    end: 2024-12-31 #[mandatory][YYYY-MM-DD] end date for weather data download 
cutout_dir: cutouts #[mandatory][string] Local directory for cutout files 
cutout_modules: [era5-edh] #[mandatory][sarah, era5-edh, era5-corrected] List of cutout modules to use 
cutout_features: [wind, influx, temperature] #[mandatory][wind, influx, temperature] list of ERA5 variables to download; wind energy: wind; solar energy: influx, temperature
# "wind_corrected","wind_corrected_extrapolated","wind_shear_exp_corrected"

cutout_name: "{study_region_name}_{year}_{modules}" #[mandatory][string] Cutout file name template; multiple modules are joined with underscores

#-- Timeseries settings -------------------------------------------------------------
timeseries:
    start: 2024-01-01 #[mandatory][YYYY-MM-DD]
    end: 2024-12-31 #[mandatory][YYYY-MM-DD] Both start and end dates are inclusive
    drop_leap_day: True #[mandatory][True/False] Whether to drop February 29 in leap years
    week52: False #[mandatory][True/False] Output 52 full weeks from the first Monday (tail filled from the start)
    test_mode: False #[mandatory][True/False] Quick test mode: only compute the first week (168 hours)

shapes_filepath: input_data/windfarmsDNK.geojson #[mandatory][string] Path to a GeoJSON file with region polygons
shapes_name_column: name #[mandatory][string] Name of the column in the GeoJSON that identifies each region 

available_land: # lava_scenarios/external_vector
    enable: False
    raster: data/Odense_solar_ref_available_land.tif

show_progress: False #[mandatory][True/False] Show atlite progress bars

technologies:
    enable: [windspeeds, onwind] # List of technologies to process (onwind, offwind, windspeeds, solar)
    wind_speed_variable: wnd100m # [mandatory][wnd100m/wnd100m_corrected]
    onwind:
        resource:
            method: wind
            turbine: Enercon_E101_3000kW # used for all polygons if turbine_column_name is empty; also accepts Renewables.ninja names, e.g. Enercon.E66.1800
            turbine_column_name: turbine_model # [optional] column in shapes file with turbine per polygon; supports Renewables.ninja model names; several turbines separated by ";"; empty cell = no timeseries for that polygon
            hubheight_column_name: hub_height # [optional] column in shapes file with hub height per polygon; empty cells use the turbine default
            smooth: False
            add_cutout_windspeed: True
        correction_factor: 0.9 # account for losses
        clip_p_max_pu: 0.01
    offwind:
        resource:
            method: wind
            turbine: NREL_ReferenceTurbine_2020ATB_5.5MW # used for all polygons if turbine_column_name is empty
            turbine_column_name: null # [optional] see onwind
            hubheight_column_name: null # [optional] column in shapes file with hub height per polygon; empty cells use the turbine default
            smooth: False
            add_cutout_windspeed: True
        correction_factor: 0.8855 # reduce hourly capacity to account for wake effects 0.8855
        clip_p_max_pu: 0.01
    windspeeds:
        resource:
            method: wind
            turbine: null # helper turbine with power curve where wind speeds are mapped to themselves defined in timeseries.py
            smooth: False
            add_cutout_windspeed: False
        correction_factor: 1.0
        clip_p_max_pu: 0.01
    solar:
        resource:
            method: pv
            panel: CSi
            orientation: latitude_optimal
            #    slope: 35.0
            #    azimuth: 180.0
            tracking: null
        correction_factor: 1.0
        clip_p_max_pu: 0.01




# --- RE Ninja (used by reninja.py; all keys optional, values below are the defaults) ---
ninja:
    dataset: merra2 # solar weather dataset
    capacity: 1 # kW, 1 gives capacity factors
    system_loss: 0.1 # solar only
    height: 100 # default wind hub height in m (used when hubheight_column_name is empty or the cell is blank)
    tilt: 35 # solar, used if technologies.solar.resource.slope is not set
    azim: 180 # solar, used if technologies.solar.resource.azimuth is not set


